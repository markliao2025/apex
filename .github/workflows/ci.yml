name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Run the documented quality gate
        run: make verify

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: migration-test
          POSTGRES_DB: apex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://apex:migration-test@localhost:5432/apex # trufflehog:ignore
      APP_ENV: test
      JWT_SECRET: migration-test-secret
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install migration dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Test upgrade, downgrade, and re-upgrade on PostgreSQL
        working-directory: backend
        run: |
          ./.venv/bin/alembic upgrade head
          ./.venv/bin/alembic downgrade 0001_initial
          ./.venv/bin/alembic upgrade head

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Start the documented zero-config demo
        run: docker compose up --build --detach
      - name: Wait for API and frontend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null \
              && curl --fail --silent http://localhost:5173/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Verify demo status
        run: |
          curl --fail --silent http://localhost:8000/api/v1/demo/status \
            | grep --fixed-strings '"status":"ready"'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the documented live API journey
        run: python scripts/e2e_demo.py
      - if: always()
        run: docker compose down --volumes

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        run: |
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium
      - name: Start the zero-configuration demo
        run: docker compose up --build --detach
      - name: Wait for API and frontend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null \
              && curl --fail --silent http://localhost:5173/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Run the Playwright demo journey
        run: npm --prefix frontend run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: docker compose down --volumes
