name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # RSC-only exception is package-scoped and expires in the npm audit
          # policy; both security jobs are required before merge.
          allow-ghsas: GHSA-qwww-vcr4-c8h2

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.95.2
        with:
          version: 3.95.2
          extra_args: --results=verified,unknown

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependency graph
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --disable-pip-version-check -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Enforce direct dependency license policy
        run: make audit-licenses
      - name: Reject high-severity npm advisories
        run: backend/.venv/bin/python scripts/check_npm_audit.py
      - name: Generate resolved SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: apex.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v7
        with:
          name: apex-sbom
          path: apex.spdx.json
          if-no-files-found: error
          retention-days: 14

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
